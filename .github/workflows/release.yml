name: Build and Release Nocturne

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version name without the v prefix, for example 1.0.8
        required: true
        type: string
      release_notes:
        description: Release notes for this candidate
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Nocturne Mobile, Bridge & WFF Watch Faces
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew and scripts
        run: |
          chmod +x gradlew
          chmod +x tools/build_all_wff.sh

      - name: Setup Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.NOCTURNE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NOCTURNE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.NOCTURNE_KEY_PASSWORD }}
        run: |
          mkdir -p .signing
          : "${KEYSTORE_BASE64:?Configure the release signing key in GitHub Secrets}"
          : "${STORE_PASSWORD:?Configure the release keystore password}"
          : "${KEY_PASSWORD:?Configure the release key password}"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > .signing/nocturne-release.jks

      - name: Determine Version Tag and Code
        id: version
        env:
          TAG: ${{ inputs.version }}
        run: |
          [[ "$TAG" =~ ^([1-9][0-9]{0,3})\.([0-9])\.(0|[1-9][0-9]?)$ ]]
          TAG_NAME="v$TAG"
          VCODE=$(( BASH_REMATCH[1] * 1000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "raw_version=$TAG" >> $GITHUB_OUTPUT
          echo "vcode=$VCODE" >> $GITHUB_OUTPUT
          echo "Version: $TAG_NAME (Code: $VCODE)"

      - name: Build Watchface Base APK
        env:
          NOCTURNE_KEYSTORE_PATH: ${{ github.workspace }}/.signing/nocturne-release.jks
          NOCTURNE_KEYSTORE_PASSWORD: ${{ secrets.NOCTURNE_KEYSTORE_PASSWORD }}
          NOCTURNE_KEY_ALIAS: ${{ secrets.NOCTURNE_KEY_ALIAS || 'nocturne' }}
          NOCTURNE_KEY_PASSWORD: ${{ secrets.NOCTURNE_KEY_PASSWORD }}
        run: |
          ./gradlew :watchface:assembleDebug -PreleaseVersionCode=${{ steps.version.outputs.vcode }} -PreleaseVersionName=${{ steps.version.outputs.raw_version }} --no-daemon

      - name: Build and Validate WFF Push Packages
        env:
          NOCTURNE_KEYSTORE_PATH: ${{ github.workspace }}/.signing/nocturne-release.jks
          NOCTURNE_KEYSTORE_PASSWORD: ${{ secrets.NOCTURNE_KEYSTORE_PASSWORD }}
          NOCTURNE_KEY_ALIAS: ${{ secrets.NOCTURNE_KEY_ALIAS || 'nocturne' }}
          NOCTURNE_KEY_PASSWORD: ${{ secrets.NOCTURNE_KEY_PASSWORD }}
        run: |
          bash tools/build_all_wff.sh "${{ steps.version.outputs.vcode }}" "${{ steps.version.outputs.raw_version }}"
          bash tools/build_all_wff.sh --studio-navy "${{ steps.version.outputs.vcode }}" "${{ steps.version.outputs.raw_version }}"
          node tools/release-manifest.mjs catalog "${{ steps.version.outputs.tag }}" "${{ steps.version.outputs.vcode }}"
          cp distribution/Nocturne-Sage-Push.apk wear-bridge/src/main/assets/

      - name: Build Wear Bridge and Phone App
        env:
          NOCTURNE_KEYSTORE_PATH: ${{ github.workspace }}/.signing/nocturne-release.jks
          NOCTURNE_KEYSTORE_PASSWORD: ${{ secrets.NOCTURNE_KEYSTORE_PASSWORD }}
          NOCTURNE_KEY_ALIAS: ${{ secrets.NOCTURNE_KEY_ALIAS || 'nocturne' }}
          NOCTURNE_KEY_PASSWORD: ${{ secrets.NOCTURNE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:testDebugUnitTest :wear-bridge:assembleRelease :app:assembleRelease -PreleaseVersionCode=${{ steps.version.outputs.vcode }} -PreleaseVersionName=${{ steps.version.outputs.raw_version }} --no-daemon

      - name: Prepare Release Artifacts
        env:
          NOCTURNE_RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          mkdir -p release-apks
          TAG="${{ steps.version.outputs.tag }}"
          
          # 1. Phone App APK
          cp "app/build/outputs/apk/release/app-release.apk" "release-apks/Nocturne-Phone-$TAG.apk"
          
          # 2. Wear OS Bridge APK (for GeminiMan install)
          cp "wear-bridge/build/outputs/apk/release/wear-bridge-release.apk" "release-apks/Nocturne-WearBridge-$TAG.apk"
          
          # 3. WFF Watch Face Push Packages
          cp "distribution/Nocturne-Sage-Push.apk" "release-apks/Nocturne-Sage-Push.apk"
          cp "distribution/Nocturne-Lunar-Push.apk" "release-apks/Nocturne-Lunar-Push.apk"
          cp "distribution/Nocturne-Obsidian-Push.apk" "release-apks/Nocturne-Obsidian-Push.apk"
          
          # 4. Catalog Manifest
          cp "distribution/catalog.json" "release-apks/catalog.json"
          
          node tools/release-manifest.mjs manifest "$TAG" "${{ steps.version.outputs.vcode }}"
          printf '%s\n' "$NOCTURNE_RELEASE_NOTES" > release-apks/RELEASE_NOTES.md
          ls -lh release-apks/

      - name: Upload release candidate for review
        uses: actions/upload-artifact@v4
        with:
          name: nocturne-${{ steps.version.outputs.tag }}
          path: release-apks/
          if-no-files-found: error

  publish:
    # Enable this job and the approved tag trigger only after publication is authorized.
    if: ${{ false }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nocturne-v${{ inputs.version }}
          path: release-apks
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Nocturne v${{ inputs.version }}
          body_path: release-apks/RELEASE_NOTES.md
          files: release-apks/*
