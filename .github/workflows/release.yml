name: Build and Release Nocturne

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Nocturne Mobile, Bridge & WFF Watch Faces
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew and scripts
        run: |
          chmod +x gradlew
          chmod +x tools/build_all_wff.sh

      - name: Determine Version Tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build Watchface Base APK
        run: |
          ./gradlew :watchface:assembleDebug --no-daemon

      - name: Build and Validate WFF Push Packages
        run: |
          bash tools/build_all_wff.sh
          # Embed WFF push packages into wear-bridge and phone assets
          mkdir -p wear-bridge/src/main/assets
          cp distribution/Nocturne-Emerald-Push.apk wear-bridge/src/main/assets/
          mkdir -p app/src/main/assets/watchfaces
          cp distribution/Nocturne-Sage-Push.apk app/src/main/assets/watchfaces/
          cp distribution/Nocturne-Lunar-Push.apk app/src/main/assets/watchfaces/
          cp distribution/Nocturne-Emerald-Push.apk app/src/main/assets/watchfaces/

      - name: Build Wear Bridge and Phone App
        run: |
          ./gradlew :wear-bridge:assembleDebug :app:assembleDebug --no-daemon

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-apks
          TAG="${{ steps.version.outputs.tag }}"
          
          # 1. Phone App APK
          cp "app/build/outputs/apk/debug/app-debug.apk" "release-apks/Nocturne-Phone-$TAG.apk"
          
          # 2. Wear OS Bridge APK (for GeminiMan install)
          cp "wear-bridge/build/outputs/apk/debug/wear-bridge-debug.apk" "release-apks/Nocturne-WearBridge-$TAG.apk"
          
          # 3. WFF Watch Face Push Packages
          cp "distribution/Nocturne-Sage-Push.apk" "release-apks/Nocturne-Sage-Push.apk"
          cp "distribution/Nocturne-Lunar-Push.apk" "release-apks/Nocturne-Lunar-Push.apk"
          cp "distribution/Nocturne-Emerald-Push.apk" "release-apks/Nocturne-Emerald-Push.apk"
          
          # 4. Catalog Manifest
          cp "distribution/catalog.json" "release-apks/catalog.json"
          
          ls -lh release-apks/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Nocturne ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          body: |
            ## Nocturne ${{ steps.version.outputs.tag }}
            
            ### 📱 تطبيق الموبايل (Samsung Galaxy S25 Ultra):
            - **`Nocturne-Phone-${{ steps.version.outputs.tag }}.apk`**
            - معاينة حية تفاعلية للثيمات الثلاثة (**Sage Nocturne** و **Lunar Phase** و **Emerald Nocturne**).
            - زر **Apply to Watch** للربط الحقيقي عبر Wear OS Data Layer وتثبيت الواجهات عن بُعد عبر **Watch Face Push API**.
            - دعم تنزيل وتحديث أي واجهات جديدة تُضاف لمستودع GitHub مباشرة وبدون الحاجة لإعادة تثبيت التطبيق.
            
            ### ⌚ تطبيق الربط للساعة (Samsung Galaxy Watch 5 - Wear OS 6):
            - **`Nocturne-WearBridge-${{ steps.version.outputs.tag }}.apk`**
            - ثبّت هذا الملف **مرة واحدة فقط** على الساعة عبر تطبيق **GeminiMan Wear OS Manager**.
            - بعد تثبيته يمكنك إغلاق الـ **Wireless Debugging** نهائياً على الساعة!
            
            ### 🎨 حزم واجهات الساعة WFF المعتمدة رسمياً (Watch Face Format):
            - **`Nocturne-Sage-Push.apk`** — الثيم العثماني الأخضر الأصلي مع الزخارف والأذكار ومنازل القمر والتعقيدات.
            - **`Nocturne-Lunar-Push.apk`** — ثيم القمر السينمائي الكبير (92% من الشاشة، 29 منزلة فلكية، وضع AOD أسود نقي).
            - **`Nocturne-Emerald-Push.apk`** — الإصدار الزمردي الإمبراطوري بتعديل بصري واضح وعقارب ذهبية لاختبار وتأكيد التحديث اللاسلكي.
            - **`catalog.json`** — فهرس الواجهات مع رموز التحقق الرسمية (Validation Tokens).
          files: |
            release-apks/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
